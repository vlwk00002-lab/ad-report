<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="color-scheme" content="light dark">
<title>광고누적성과</title>
<style>
  :root{
    --paper:#ffffff;
    --ground:#f6f6f7;
    --ink:#111214;
    --ink2:#5f6165;
    --mute:#8a8c90;
    --line:#e4e4e6;
    --rule:#33343a;
    --band:#f4f4f5;
    --zebra:#fafafa;
    --live:#0a7d32;
    --alarm:#c0201c;
    --alarmbg:#fff4f4;
    --alarmline:#e8a9a7;
    --shadow:0 1px 2px rgba(17,18,20,.06);
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --paper:#1a1b1e;
      --ground:#141517;
      --ink:#ececee;
      --ink2:#a6a8ad;
      --mute:#84868b;
      --line:#2d2f33;
      --rule:#71747a;
      --band:#232529;
      --zebra:#1f2023;
      --live:#4fb572;
      --alarm:#ef6e6a;
      --alarmbg:#2a1c1c;
      --alarmline:#5d3533;
      --shadow:0 1px 2px rgba(0,0,0,.4);
    }
  }
  :root[data-theme="dark"]{
    --paper:#1a1b1e;
    --ground:#141517;
    --ink:#ececee;
    --ink2:#a6a8ad;
    --mute:#84868b;
    --line:#2d2f33;
    --rule:#71747a;
    --band:#232529;
    --zebra:#1f2023;
    --live:#4fb572;
    --alarm:#ef6e6a;
    --alarmbg:#2a1c1c;
    --alarmline:#5d3533;
    --shadow:0 1px 2px rgba(0,0,0,.4);
  }

  *{box-sizing:border-box}
  [hidden]{display:none!important}
  body{
    margin:0;
    background:var(--ground);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Malgun Gothic","맑은 고딕","Apple SD Gothic Neo",sans-serif;
    font-size:14px;
    line-height:1.5;
    -webkit-text-size-adjust:100%;
  }
  .num{font-variant-numeric:tabular-nums}

  /* ── 날짜 바 ───────────────────────────── */
  .bar{
    position:sticky;
    top:env(safe-area-inset-top,0px);
    z-index:20;
    display:grid;
    grid-template-columns:52px 1fr 52px;
    align-items:center;
    gap:4px;
    background:var(--paper);
    border-bottom:1px solid var(--line);
    padding:9px 8px;
  }
  .nav{
    appearance:none;
    -webkit-appearance:none;
    width:100%;
    height:42px;
    border:1px solid var(--line);
    border-radius:8px;
    background:var(--paper);
    color:var(--ink);
    font-size:21px;
    line-height:1;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    transition:background .12s ease,border-color .12s ease;
  }
  .nav:hover:not(:disabled){background:var(--band);border-color:var(--rule)}
  .nav:disabled{opacity:.24;cursor:default}
  .nav:focus-visible{outline:2px solid var(--rule);outline-offset:2px}
  .barmid{text-align:center;min-width:0}
  .day{
    margin:0;
    font-size:18px;
    font-weight:700;
    letter-spacing:-.01em;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .daysub{color:var(--mute);font-size:11.5px;margin-top:1px}

  /* ── 캘린더 ──────────────────────────── */
  .daybtn{
    appearance:none;-webkit-appearance:none;background:none;border:0;padding:0;margin:0;
    color:inherit;font:inherit;cursor:pointer;display:inline-flex;align-items:center;
    gap:5px;max-width:100%;border-radius:5px;
  }
  .daybtn:focus-visible{outline:2px solid var(--rule);outline-offset:3px}
  .calicon{flex:none;color:var(--mute);transition:color .12s ease}
  .daybtn:hover .calicon,
  .daybtn[aria-expanded="true"] .calicon{color:var(--ink)}
  .calwrap{position:fixed;inset:0;z-index:30}
  .cal{
    position:absolute;left:50%;transform:translateX(-50%);
    top:calc(env(safe-area-inset-top,0px) + 64px);
    width:302px;max-width:calc(100vw - 24px);
    background:var(--paper);border:1px solid var(--line);border-radius:11px;
    box-shadow:0 10px 30px rgba(0,0,0,.22);padding:12px;
  }
  .calhead{display:grid;grid-template-columns:34px 1fr 34px;align-items:center;margin-bottom:9px}
  .calhead .m{text-align:center;font-size:14px;font-weight:700}
  .calnav{
    appearance:none;-webkit-appearance:none;height:30px;border:1px solid var(--line);
    border-radius:7px;background:var(--paper);color:var(--ink);font-size:14px;cursor:pointer;
  }
  .calnav:hover:not(:disabled){background:var(--band)}
  .calnav:disabled{opacity:.25;cursor:default}
  .caldow{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-bottom:5px}
  .caldow span{text-align:center;font-size:10.5px;color:var(--mute)}
  .calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
  .calgrid .pad{height:34px}
  .calgrid button{
    height:34px;border:0;border-radius:7px;background:none;color:var(--ink);
    font:inherit;font-size:12.5px;cursor:pointer;font-variant-numeric:tabular-nums;
  }
  .calgrid button:disabled{color:var(--mute);opacity:.3;cursor:default}
  .calgrid button.has{background:var(--band);font-weight:600}
  .calgrid button.has:hover{background:var(--line)}
  .calgrid button.sel{background:var(--rule);color:var(--paper);font-weight:700}

  /* ── 탭 ──────────────────────────────── */
  .tabs{display:flex;gap:2px;margin:0 auto 12px;width:fit-content}
  .tab{
    appearance:none;-webkit-appearance:none;border:0;background:none;
    color:var(--mute);font:inherit;font-size:13px;font-weight:600;
    padding:7px 16px;border-radius:7px;cursor:pointer;
  }
  .tab:hover{color:var(--ink2)}
  .tab.on{background:var(--paper);color:var(--ink);box-shadow:var(--shadow)}
  .tab:focus-visible{outline:2px solid var(--rule);outline-offset:2px}

  /* ── 광고별 ──────────────────────────── */
  .csearch{
    width:100%;padding:10px 12px;font-size:14px;border:1px solid var(--line);
    border-radius:8px;background:var(--ground);color:var(--ink);font-family:inherit;
    margin-bottom:12px;
  }
  .csearch:focus{outline:2px solid var(--rule);outline-offset:-1px;border-color:var(--rule)}
  .clist{display:flex;flex-direction:column;gap:6px}
  .citem{border:1px solid var(--line);border-radius:8px;overflow:hidden}
  .chead{
    display:grid;grid-template-columns:26px 1fr auto;gap:10px;align-items:center;
    width:100%;padding:11px 13px;background:none;border:0;cursor:pointer;
    color:var(--ink);font:inherit;text-align:left;
  }
  .chead:hover{background:var(--band)}
  .chead:focus-visible{outline:2px solid var(--rule);outline-offset:-2px}
  .cemo{font-size:17px;line-height:1}
  .cname{font-size:13.5px;font-weight:600;word-break:break-all}
  .cmeta{font-size:11px;color:var(--mute);margin-top:2px}
  .cmeta .on{color:var(--live)}
  .cspend{font-size:13px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
  .cbody{border-top:1px solid var(--line);padding:10px 13px 13px}
  /* 광고별 상세표는 좁은 화면에서도 그대로 둔다(가로 스크롤). 첫 칸은 고정. */
  .ctable{overflow-x:auto;-webkit-overflow-scrolling:touch}
  .ctable th.l,.ctable td.l{position:sticky;left:0;z-index:1;background:var(--paper)}
  .ctable th.l{background:var(--band)}
  .cbody table{font-size:12.5px}
  .cbody td.l{font-weight:600}
  .cbody tr:last-child td{font-weight:700;border-top:1px solid var(--line)}
  .cempty{color:var(--mute);font-size:13px;text-align:center;padding:28px 0}

  /* ── 본문 ─────────────────────────────── */
  .wrap{max-width:1240px;margin:0 auto;padding:16px;padding-block:18px 56px}
  .sheet{background:var(--paper);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:16px;overflow:hidden}
  @media (max-width:700px){ .wrap{padding-inline:10px} .sheet{padding:12px;border-radius:8px} }

  .alarm{
    background:var(--alarmbg);border:1px solid var(--alarmline);
    border-radius:6px;padding:10px 12px;margin-bottom:14px;font-size:13px;
  }
  .alarm b{color:var(--alarm)}
  .alarm ul{margin:6px 0 0 18px;padding:0}

  /* 기준점 */
  .bench{border:2px solid var(--rule);border-radius:7px;padding:11px 13px;margin-bottom:18px;background:var(--ground)}
  .benchtag{
    background:var(--rule);color:var(--paper);padding:2px 8px;border-radius:3px;
    font-size:10.5px;font-weight:700;letter-spacing:.5px;
  }
  .benchname{font-size:15px;font-weight:700;margin-left:8px}
  .benchmeta{color:var(--mute);font-size:11px;margin-left:8px}
  .benchgrid{
    display:grid;grid-template-columns:repeat(auto-fit,minmax(88px,1fr));
    gap:9px 14px;margin-top:10px;
  }
  .benchgrid div{min-width:0}
  .benchgrid dt{color:var(--mute);font-size:10.5px;white-space:nowrap}
  .benchgrid dd{margin:1px 0 0;font-size:14.5px;font-weight:700;white-space:nowrap}
  .benchfoot{color:var(--mute);font-size:11px;margin-top:9px}

  /* ── 표 (넓은 화면) ────────────────────── */
  .tablewrap{overflow-x:auto}
  table{border-collapse:collapse;width:100%;font-size:13px}
  th{
    padding:8px 9px;border-bottom:2px solid var(--rule);background:var(--band);
    text-align:right;white-space:nowrap;font-size:11.5px;font-weight:600;color:var(--ink);
  }
  th.l{text-align:left}
  td{padding:6px 9px;text-align:right;white-space:nowrap}
  td.l{text-align:left}
  tr.d1 td{color:var(--mute);font-size:12px}
  tr.cum td{color:var(--ink);font-size:13px;font-weight:600;border-bottom:1px solid var(--line)}
  td.nm{vertical-align:top;border-bottom:1px solid var(--line)}
  td.em{font-size:16px;vertical-align:middle;border-bottom:1px solid var(--line);text-align:left}
  .nmname{font-size:13px;font-weight:600}
  .nmsub{font-size:11px;margin-top:2px;color:var(--mute)}
  .nmsub .on{color:var(--live)}
  .nmraw{color:var(--mute);font-size:11px}
  .nmwarn{color:var(--alarm);font-size:11px}
  tr.sum td{background:var(--zebra)}
  td.sumlab{font-weight:700}

  /* ── 카드 (좁은 화면) ──────────────────── */
  .cards{display:flex;flex-direction:column;gap:10px}
  .card{border:1px solid var(--line);border-radius:8px;overflow:hidden}
  .card.total{border-color:var(--rule);border-width:2px}
  .cardhead{display:flex;gap:9px;align-items:flex-start;padding:10px 12px;background:var(--band);border-bottom:1px solid var(--line)}
  .cardemo{font-size:19px;line-height:1.2}
  .cardname{font-size:14px;font-weight:700;word-break:break-all}
  .cardmeta{font-size:11px;color:var(--mute);margin-top:1px}
  .cardmeta .on{color:var(--live)}
  .grid{display:grid;grid-template-columns:1fr auto auto;gap:0}
  .grid > *{padding:5px 12px;border-bottom:1px solid var(--line);font-size:13px;min-width:0}
  .grid > *:nth-child(3n){text-align:right;font-weight:600}
  .grid > *:nth-child(3n+2){text-align:right;color:var(--mute);font-size:12px}
  .grid .hd{
    background:var(--zebra);font-size:10.5px;color:var(--mute);
    text-transform:none;letter-spacing:.3px;font-weight:600;padding-top:6px;padding-bottom:6px;
  }
  .grid .hd:nth-child(3n),.grid .hd:nth-child(3n+2){color:var(--mute);font-weight:600;font-size:10.5px}
  .grid .k{color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .grid > *:nth-last-child(-n+3){border-bottom:0}

  /* 표/카드 전환 */
  .cards{display:none}
  @media (max-width:860px){
    .tablewrap{display:none}
    .cards{display:flex}
  }

  /* 각주 — 메일과 같이 항상 펼쳐 둔다 */
  .notes{margin-top:16px;border-top:1px solid var(--line);padding-top:10px}
  .noteshead{color:var(--ink2);font-size:12px;font-weight:600;margin-bottom:6px}
  .notebody{color:var(--mute);font-size:11.5px;line-height:1.85}
  .notebody b{color:var(--ink2)}

  /* 그 날만 달리 읽히는 행 설명 — 표 밖, 계산 기준 위 */
  .rownotes{margin-top:12px;font-size:11.5px;color:var(--mute);line-height:1.7}
  .rownotes div{margin-top:3px}
  .rownotes b{color:var(--ink2);font-weight:600}
  .stamp{color:var(--mute);font-size:11px;text-align:center;margin-top:14px}

  /* ── 암호 ─────────────────────────────── */
  .gate{
    position:fixed;inset:0;z-index:50;background:var(--ground);
    display:flex;align-items:center;justify-content:center;padding:24px;
  }
  .gatebox{width:100%;max-width:300px;text-align:center}
  .gatetitle{font-size:16px;font-weight:700}
  .gatesub{color:var(--mute);font-size:12px;margin-top:5px;margin-bottom:16px}
  .gate input{
    width:100%;padding:11px 13px;font-size:16px;border:1px solid var(--line);
    border-radius:8px;background:var(--paper);color:var(--ink);text-align:center;
    font-family:inherit;
  }
  .gate input:focus{outline:2px solid var(--rule);outline-offset:1px;border-color:var(--rule)}
  .gate button{
    width:100%;margin-top:9px;padding:11px;font-size:14px;font-weight:600;
    border:0;border-radius:8px;background:var(--rule);color:var(--paper);
    cursor:pointer;font-family:inherit;
  }
  .gate button:disabled{opacity:.5;cursor:default}
  .gateerr{color:var(--alarm);font-size:12px;margin-top:10px;min-height:16px}

  .msg{text-align:center;color:var(--mute);padding:48px 16px;font-size:13px}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

</head>
<body>
<div class="bar">
  <button class="nav" id="prev" type="button" aria-label="전일 보고서" disabled>&#8592;</button>
  <div class="barmid">
    <h1 class="day"><button class="daybtn" id="dayBtn" type="button" aria-expanded="false" aria-haspopup="dialog" aria-label="날짜 선택"><svg class="calicon" width="14" height="14" viewBox="0 0 16 16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"><rect x="1.6" y="3.2" width="12.8" height="11.2" rx="2"/><path d="M1.6 6.6h12.8"/><path d="M5.2 1.6v3.2"/><path d="M10.8 1.6v3.2"/></svg><span id="day">광고누적성과</span></button></h1>
    <div class="daysub" id="daysub">불러오는 중</div>
  </div>
  <button class="nav" id="next" type="button" aria-label="다음날 보고서" disabled>&#8594;</button>
</div>

<div class="calwrap" id="calwrap" hidden>
  <div class="cal" role="dialog" aria-label="날짜 선택">
    <div class="calhead">
      <button class="calnav" id="calprev" type="button" aria-label="이전 달">&#8249;</button>
      <div class="m" id="calm"></div>
      <button class="calnav" id="calnext" type="button" aria-label="다음 달">&#8250;</button>
    </div>
    <div class="caldow"><span>일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span></div>
    <div class="calgrid" id="calgrid"></div>
  </div>
</div>

<div class="wrap">
  <div class="tabs" id="tabs" hidden>
    <button class="tab on" id="tabDay" type="button">날짜별</button>
    <button class="tab" id="tabCamp" type="button">광고별</button>
  </div>
  <div class="sheet" id="sheet"><div class="msg">불러오는 중…</div></div>
  <div class="sheet" id="csheet" hidden></div>
</div>

<div class="gate" id="gate" hidden>
  <div class="gatebox">
    <div class="gatetitle">마케팅팀 화이팅</div>
    <div class="gatesub">암호를 입력하세요</div>
    <input id="pw" type="password" inputmode="numeric" autocomplete="current-password" aria-label="암호">
    <button id="go" type="button">열기</button>
    <div class="gateerr" id="err"></div>
  </div>
</div>

<script>
"use strict";
(function () {
  var COLS = ["광고비","DB","DB당단가","유입","유입당비용","유입률",
              "체험완료","체험당비용","체험완료율","전환","전환당비용"];
  var PW_KEY = "adreport.pw";
  var manifest = null, key = null, dates = [], idx = -1, cache = {};

  var $ = function (id) { return document.getElementById(id); };
  var enc = new TextEncoder(), dec = new TextDecoder();

  function store(k, v) { try { v === null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch (e) {} }
  function load(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function b64(s) { var r = atob(s), a = new Uint8Array(r.length); for (var i = 0; i < r.length; i++) a[i] = r.charCodeAt(i); return a; }
  function cat(a, b) { var o = new Uint8Array(a.length + b.length); o.set(a, 0); o.set(b, a.length); return o; }

  // 암호 → 키. 사이트 전체가 소금 하나를 쓰므로 한 번만 계산한다.
  function derive(pw, salt, iter) {
    return crypto.subtle
      .importKey("raw", enc.encode(pw), "PBKDF2", false, ["deriveBits"])
      .then(function (base) {
        return crypto.subtle.deriveBits(
          { name: "PBKDF2", salt: salt, iterations: iter, hash: "SHA-256" }, base, 512);
      })
      .then(function (bits) {
        var b = new Uint8Array(bits);
        return Promise.all([hmac(b.slice(0, 32)), hmac(b.slice(32, 64))]);
      })
      .then(function (p) { return { e: p[0], m: p[1] }; });
  }
  function hmac(raw) {
    return crypto.subtle.importKey("raw", raw, { name: "HMAC", hash: "SHA-256" }, false, ["sign"]);
  }

  function decrypt(payload, k) {
    var raw = b64(payload);
    var nonce = raw.slice(0, 12), tag = raw.slice(12, 44), ct = raw.slice(44);
    return crypto.subtle.sign("HMAC", k.m, cat(nonce, ct)).then(function (sig) {
      var t = new Uint8Array(sig), ok = t.length === tag.length, diff = 0;
      for (var i = 0; i < tag.length; i++) diff |= t[i] ^ tag[i];
      if (!ok || diff !== 0) throw new Error("auth");
      var blocks = [], n = Math.ceil(ct.length / 32);
      for (var j = 0; j < n; j++) {
        var ctr = new Uint8Array(16);
        ctr.set(nonce, 0);
        ctr[12] = (j >>> 24) & 255; ctr[13] = (j >>> 16) & 255;
        ctr[14] = (j >>> 8) & 255;  ctr[15] = j & 255;
        blocks.push(crypto.subtle.sign("HMAC", k.e, ctr));
      }
      return Promise.all(blocks).then(function (ks) {
        var out = new Uint8Array(ct.length);
        for (var j = 0; j < ks.length; j++) {
          var s = new Uint8Array(ks[j]), off = j * 32;
          for (var b = 0; b < 32 && off + b < ct.length; b++) out[off + b] = ct[off + b] ^ s[b];
        }
        return JSON.parse(dec.decode(out));
      });
    });
  }

  function esc(s) {
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }
  function stateCls(s) { return s === "운영중" ? ' class="on"' : ""; }
  function label(d) {
    var p = d.split("-");
    return Number(p[1]) + "월 " + Number(p[2]) + "일 광고누적성과";
  }

  // ── 렌더 ────────────────────────────────
  function render(r) {
    var h = [];

    if (r.warn && r.warn.length) {
      h.push('<div class="alarm"><b>데이터 확인 필요</b><ul>');
      r.warn.forEach(function (w) { h.push("<li>" + esc(w) + "</li>"); });
      h.push("</ul></div>");
    }

    if (r.bench) {
      var b = r.bench;
      h.push('<div class="bench"><div>');
      h.push('<span class="benchtag">기준점</span>');
      h.push('<span class="benchname">' + esc(b.emoji) + " " + esc(b.name) + "</span>");
      h.push('<span class="benchmeta">' + esc(b.state) + " · " + esc(b.period) + " · 누적</span>");
      h.push('</div><dl class="benchgrid">');
      b.cells.forEach(function (c) {
        h.push("<div><dt>" + esc(c[0]) + '</dt><dd class="num">' + esc(c[1]) + "</dd></div>");
      });
      h.push('</dl><div class="benchfoot">아래 광고들의 수치를 이 값과 견주어 보세요.</div></div>');
    }

    // 표
    h.push('<div class="tablewrap"><table><thead><tr>');
    h.push('<th class="l">광고명</th><th class="l">이모지</th><th class="l">구분</th>');
    COLS.forEach(function (c) { h.push("<th>" + esc(c) + "</th>"); });
    h.push("</tr></thead><tbody>");

    r.rows.forEach(function (row) {
      var sub = row.no_ad
        ? '<div class="nmwarn">광고비 미입력</div>'
        : (row.raw && row.raw !== row.name ? '<div class="nmraw">광고탭: ' + esc(row.raw) + "</div>" : "");
      h.push("<tr class='d1'>");
      h.push('<td class="l nm" rowspan="2"><div class="nmname">' + esc(row.name) + "</div>" + sub +
             '<div class="nmsub"><span' + stateCls(row.state) + ">" + esc(row.state) + "</span> · " + esc(row.period) + "</div></td>");
      h.push('<td class="em" rowspan="2">' + esc(row.emoji || "-") + "</td>");
      h.push('<td class="l">전일</td>');
      row.d1.forEach(function (v) { h.push('<td class="num">' + esc(v) + "</td>"); });
      h.push("</tr><tr class='cum'>");
      h.push('<td class="l">누적</td>');
      row.cum.forEach(function (v) { h.push('<td class="num">' + esc(v) + "</td>"); });
      h.push("</tr>");
    });

    h.push('<tr class="sum d1"><td class="l sumlab" colspan="2" rowspan="2">합계</td><td class="l">전일</td>');
    r.total.d1.forEach(function (v) { h.push('<td class="num">' + esc(v) + "</td>"); });
    h.push('</tr><tr class="sum cum"><td class="l">누적</td>');
    r.total.cum.forEach(function (v) { h.push('<td class="num">' + esc(v) + "</td>"); });
    h.push("</tr></tbody></table></div>");

    // 카드
    h.push('<div class="cards">');
    r.rows.forEach(function (row) {
      var sub = row.no_ad
        ? '<div class="nmwarn">광고비 미입력</div>'
        : (row.raw && row.raw !== row.name ? '<div class="nmraw">광고탭: ' + esc(row.raw) + "</div>" : "");
      h.push('<section class="card"><div class="cardhead"><div class="cardemo">' + esc(row.emoji || "·") + "</div><div>");
      h.push('<div class="cardname">' + esc(row.name) + "</div>" + sub);
      h.push('<div class="cardmeta"><span' + stateCls(row.state) + ">" + esc(row.state) + "</span> · " + esc(row.period) + "</div>");
      h.push("</div></div>");
      h.push(cardGrid(row.d1, row.cum));
      h.push("</section>");
    });
    h.push('<section class="card total"><div class="cardhead"><div class="cardemo">Σ</div><div>');
    h.push('<div class="cardname">합계</div><div class="cardmeta">' + esc(r.rows.length) + "개 광고</div></div></div>");
    h.push(cardGrid(r.total.d1, r.total.cum));
    h.push("</section></div>");

    var rn = r.rows.filter(function (x) { return x.note; });
    if (rn.length) {
      h.push('<div class="rownotes">');
      rn.forEach(function (x) {
        h.push("<div><b>" + esc(x.emoji || "") + " " + esc(x.name) + "</b> &mdash; " + esc(x.note) + "</div>");
      });
      h.push("</div>");
    }

    h.push('<div class="notes"><div class="noteshead">계산 기준</div><div class="notebody">' + notes(r.date) + "</div></div>");
    h.push('<div class="stamp">' + esc(r.generated || "") + " 생성</div>");

    $("sheet").innerHTML = h.join("");
  }

  function cardGrid(d1, cum) {
    var g = ['<div class="grid"><div class="hd">&nbsp;</div><div class="hd">전일</div><div class="hd">누적</div>'];
    for (var i = 0; i < COLS.length; i++) {
      var a = d1[i] == null || d1[i] === "" ? "" : d1[i];
      var b = cum[i] == null || cum[i] === "" ? "" : cum[i];
      if (a === "" && b === "") continue;
      g.push('<div class="k">' + esc(COLS[i]) + '</div><div class="num">' + esc(a) + '</div><div class="num">' + esc(b) + "</div>");
    }
    g.push("</div>");
    return g.join("");
  }

  function notes(d) {
    return "<b>전일</b> = " + esc(d) + " 하루치 · <b>누적</b> = 광고 시작일부터 " + esc(d) + "까지 합산<br>" +
      "DB = 광고관리자 결과 수 · 유입 = 카카오 채팅 유입(같은 방·같은 광고·같은 날은 1건) · 유입률 = 유입 ÷ DB<br>" +
      "유입당비용 = 광고비 ÷ 유입 · 체험당비용 = 광고비 ÷ 체험완료 · 체험완료율 = 체험완료 ÷ 유입 · 전환당비용 = 광고비 ÷ 전환<br>" +
      "체험완료는 상담 대화 원문으로 판정하고, 완료 시각 직전의 마지막 유입 캠페인에 1건만 귀속합니다(합계 = 실제 사람 수).<br>" +
      "누적은 해당 광고가 광고탭에 처음 등장한 날부터 셉니다(광고 시작 전 유입은 제외).<br>" +
      "전환은 결제 직전의 마지막 유입 광고에 1건씩 귀속됩니다. 결제일이 아니라 그 유입일에 " +
      "기록되므로 최근 유입분은 나중에 늘어납니다.<br>" +
      "분모가 0이면 '-'로 표시합니다.<br>" +
      "광고비는 전일까지만 기록되어 당일치는 포함되지 않습니다.";
  }

  // ── 이동 ────────────────────────────────
  function fetchDay(d) {
    if (cache[d]) return Promise.resolve(cache[d]);
    return fetch("data/" + d + ".json", { cache: "no-cache" })
      .then(function (res) { if (!res.ok) throw new Error("http " + res.status); return res.text(); })
      .then(function (t) { return decrypt(t.trim(), key); })
      .then(function (r) { cache[d] = r; return r; });
  }

  function show(i, push) {
    if (i < 0 || i >= dates.length) return;
    idx = i;
    var d = dates[i];
    $("day").textContent = label(d);
    $("daysub").textContent = "불러오는 중…";
    $("prev").disabled = i <= 0;
    $("next").disabled = i >= dates.length - 1;
    if (push) { try { history.replaceState(null, "", "#" + d); } catch (e) {} }
    if (!$("calwrap").hidden) closeCal();
    fetchDay(d).then(function (r) {
      if (dates[idx] !== d) return;
      $("daysub").textContent = r.date + " 까지 · 광고 " + r.rows.length + "건 · 전일과 누적 두 줄";
      render(r);
      window.scrollTo(0, 0);
      [i - 1, i + 1].forEach(function (j) { if (dates[j]) fetchDay(dates[j]).catch(function () {}); });
    }).catch(function (e) {
      // 목록에는 있는데 파일이 없을 수 있다(내린 직후 GitHub 캐시가 남는 경우).
      // 그 날짜는 목록에서 빼고 이웃 날짜를 보여준다.
      var gone = dates.indexOf(d);
      if (gone >= 0 && dates.length > 1) {
        dates.splice(gone, 1);
        delete cache[d];
        show(Math.min(gone, dates.length - 1), true);
        return;
      }
      $("daysub").textContent = "";
      $("sheet").innerHTML = '<div class="msg">' + d + " 보고서를 불러오지 못했습니다.<br>" + esc(e.message) + "</div>";
    });
  }

  // ── 광고별 보기 ─────────────────────────
  // 날짜별이 주(主)다. 광고별은 끝난 광고를 나중에 찾기 위한 보조 화면이라
  // 처음 열 때만 내려받는다(날짜별 화면 속도를 건드리지 않으려고).
  var camp = null, campErr = null, openCamp = {};

  function showTab(which) {
    var day = which === "day";
    $("tabDay").classList.toggle("on", day);
    $("tabCamp").classList.toggle("on", !day);
    $("sheet").hidden = !day;
    $("csheet").hidden = day;
    document.querySelector(".bar").hidden = !day;   // 광고별에선 날짜 이동이 의미 없다
    if (!day) loadCamp();
  }

  function loadCamp() {
    if (camp) { drawCamp(); return; }
    if (campErr) { $("csheet").innerHTML = '<div class="cempty">' + esc(campErr) + "</div>"; return; }
    $("csheet").innerHTML = '<div class="cempty">불러오는 중…</div>';
    fetch("data/campaigns.json", { cache: "no-cache" })
      .then(function (r) { if (!r.ok) throw new Error("아직 만들어지지 않았습니다."); return r.text(); })
      .then(function (x) { return decrypt(x.trim(), key); })
      .then(function (d) { camp = d; drawCamp(); })
      .catch(function (e) {
        campErr = e.message === "auth" ? "암호가 맞지 않습니다." : e.message;
        $("csheet").innerHTML = '<div class="cempty">' + esc(campErr) + "</div>";
      });
  }

  function campTable(it) {
    var h = ['<div class="ctable"><table><thead><tr><th class="l">구분</th>'];
    camp.cols.forEach(function (c) { h.push("<th>" + esc(c) + "</th>"); });
    h.push("</tr></thead><tbody>");
    it.rows.forEach(function (r) {
      h.push('<tr><td class="l">' + esc(r.label) + "</td>");
      r.cells.forEach(function (v) { h.push('<td class="num">' + esc(v) + "</td>"); });
      h.push("</tr>");
    });
    return h.join("") + "</tbody></table></div>";
  }

  function drawCamp() {
    var box = $("csearch");
    if (!box) {
      $("csheet").innerHTML =
        '<input class="csearch" id="csearch" type="search" placeholder="광고 이름으로 찾기">' +
        '<div id="clistwrap"></div>' +
        '<div class="stamp">' + esc(camp.cutoff) + " 까지 · 광고 " + camp.items.length +
        "건 · " + esc(camp.generated) + " 생성</div>";
      box = $("csearch");
    }
    var q = box.value.trim().toLowerCase();
    var list = camp.items.filter(function (x) {
      return !q || (x.name + " " + x.raw + " " + x.emoji).toLowerCase().indexOf(q) >= 0;
    });
    var h = [];
    if (!list.length) {
      h.push('<div class="cempty">찾는 광고가 없습니다.</div>');
    } else {
      h.push('<div class="clist">');
      list.forEach(function (x) {
        var on = !!openCamp[x.name];
        h.push('<section class="citem">');
        h.push('<button class="chead" type="button" data-n="' + esc(x.name) + '" aria-expanded="' + on + '">');
        h.push('<span class="cemo">' + esc(x.emoji || "·") + "</span><span>");
        h.push('<span class="cname">' + esc(x.name) + "</span>");
        h.push('<div class="cmeta"><span' + (x.state === "운영중" ? ' class="on"' : "") + ">" +
               esc(x.state) + "</span> · " + esc(x.period) + "</div></span>");
        h.push('<span class="cspend">' + esc(x.spend) + "</span></button>");
        if (on) h.push('<div class="cbody">' + campTable(x) + "</div>");
        h.push("</section>");
      });
      h.push("</div>");
    }
    $("clistwrap").innerHTML = h.join("");
  }

  $("csheet").addEventListener("click", function (e) {
    var b = e.target.closest ? e.target.closest(".chead") : null;
    if (!b) return;
    var n = b.getAttribute("data-n");
    openCamp[n] = !openCamp[n];
    drawCamp();
  });
  var composing = false;
  $("csheet").addEventListener("compositionstart", function (e) {
    if (e.target.id === "csearch") composing = true;
  });
  $("csheet").addEventListener("compositionend", function (e) {
    if (e.target.id === "csearch") { composing = false; drawCamp(); }
  });
  $("csheet").addEventListener("input", function (e) {
    if (e.target.id === "csearch" && !composing) drawCamp();
  });
  $("tabDay").addEventListener("click", function () { showTab("day"); });
  $("tabCamp").addEventListener("click", function () { showTab("camp"); });

  // ── 캘린더 ──────────────────────────────
  // 날짜가 쌓이면 화살표만으로는 멀리 못 간다. 가운데 날짜를 눌러 연다.
  // 보고서가 있는 날만 누를 수 있고, 없는 날은 흐리게 둔다.
  var calYM = null;

  function ym(d) { return d.slice(0, 7); }
  function shiftYM(s, n) {
    var d = new Date(+s.slice(0, 4), +s.slice(5, 7) - 1 + n, 1);
    return d.getFullYear() + "-" + ("0" + (d.getMonth() + 1)).slice(-2);
  }
  function pad2(n) { return ("0" + n).slice(-2); }

  function drawCal() {
    var y = +calYM.slice(0, 4), m = +calYM.slice(5, 7);
    var start = new Date(y, m - 1, 1).getDay();
    var last = new Date(y, m, 0).getDate();
    $("calm").textContent = y + "년 " + m + "월";
    $("calprev").disabled = calYM <= ym(dates[0]);
    $("calnext").disabled = calYM >= ym(dates[dates.length - 1]);
    var g = [], i;
    for (i = 0; i < start; i++) g.push('<div class="pad"></div>');
    for (i = 1; i <= last; i++) {
      var iso = calYM + "-" + pad2(i);
      var on = dates.indexOf(iso) >= 0;
      var cls = on ? (iso === dates[idx] ? "has sel" : "has") : "";
      g.push('<button type="button" class="' + cls + '" data-d="' + iso + '"' +
             (on ? "" : " disabled") + ">" + i + "</button>");
    }
    $("calgrid").innerHTML = g.join("");
  }

  function openCal() {
    if (!dates.length) return;
    calYM = ym(dates[idx] || dates[dates.length - 1]);
    drawCal();
    $("calwrap").hidden = false;
    $("dayBtn").setAttribute("aria-expanded", "true");
  }
  function closeCal() {
    $("calwrap").hidden = true;
    $("dayBtn").setAttribute("aria-expanded", "false");
  }

  $("dayBtn").addEventListener("click", function () {
    if ($("calwrap").hidden) openCal(); else closeCal();
  });
  $("calprev").addEventListener("click", function () { calYM = shiftYM(calYM, -1); drawCal(); });
  $("calnext").addEventListener("click", function () { calYM = shiftYM(calYM, 1); drawCal(); });
  $("calgrid").addEventListener("click", function (e) {
    var b = e.target.closest ? e.target.closest("button[data-d]") : null;
    if (!b || b.disabled) return;
    var i = dates.indexOf(b.getAttribute("data-d"));
    if (i >= 0) { closeCal(); show(i, true); }
  });
  $("calwrap").addEventListener("click", function (e) {
    if (e.target === $("calwrap")) closeCal();   // 바깥을 누르면 닫는다
  });

  $("prev").addEventListener("click", function () { show(idx - 1, true); });
  $("next").addEventListener("click", function () { show(idx + 1, true); });
  document.addEventListener("keydown", function (e) {
    if (e.target && /^(INPUT|TEXTAREA)$/.test(e.target.tagName)) return;
    if (e.key === "Escape") { closeCal(); return; }
    if (e.key === "ArrowLeft") show(idx - 1, true);
    if (e.key === "ArrowRight") show(idx + 1, true);
  });
  var tx = 0, ty = 0;
  document.addEventListener("touchstart", function (e) { tx = e.touches[0].clientX; ty = e.touches[0].clientY; }, { passive: true });
  document.addEventListener("touchend", function (e) {
    var dx = e.changedTouches[0].clientX - tx, dy = e.changedTouches[0].clientY - ty;
    if (Math.abs(dx) > 70 && Math.abs(dx) > Math.abs(dy) * 2) show(dx < 0 ? idx + 1 : idx - 1, true);
  }, { passive: true });

  // ── 시작 ────────────────────────────────
  function start(pw, fromGate) {
    return derive(pw, b64(manifest.salt), manifest.iter).then(function (k) {
      key = k;
      var want = (location.hash || "").replace("#", "");
      var i = dates.indexOf(want);
      if (i < 0) i = dates.length - 1;

      // 고른 날짜의 파일이 없으면 더 이전 날짜로 내려가며 찾는다.
      // 암호가 틀린 것과 파일이 없는 것을 구분해야 하므로 여기서 한 번은 실제로 풀어 본다.
      function tryFrom(j) {
        return fetchDay(dates[j]).then(function () { return j; }, function (e) {
          if (e && e.message === "auth") throw e;
          if (j > 0) return tryFrom(j - 1);
          throw e;
        });
      }
      return tryFrom(i).then(function (j) {
        store(PW_KEY, pw);
        $("err").textContent = "";
        $("gate").hidden = true;
        $("tabs").hidden = false;
        show(j, false);
      });
    }).catch(function (e) {
      key = null;
      if (e && e.message === "auth") {
        store(PW_KEY, null);
        $("gate").hidden = false;
        $("err").textContent = fromGate ? "암호가 맞지 않습니다." : "";
        $("pw").value = "";
        $("pw").focus();
        $("go").disabled = false;
      } else {
        $("sheet").innerHTML = '<div class="msg">보고서를 불러오지 못했습니다.<br>' + esc(e.message) + "</div>";
        $("gate").hidden = true;
      }
      throw e;
    });
  }

  $("go").addEventListener("click", function () {
    var v = $("pw").value;
    if (!v) return;
    $("go").disabled = true;
    $("err").textContent = "확인 중…";
    start(v, true).catch(function () {});
  });
  $("pw").addEventListener("keydown", function (e) { if (e.key === "Enter") $("go").click(); });

  fetch("data/index.json", { cache: "no-cache" })
    .then(function (r) { return r.json(); })
    .then(function (m) {
      manifest = m;
      dates = (m.dates || []).slice().sort();
      if (!dates.length) { $("sheet").innerHTML = '<div class="msg">아직 보고서가 없습니다.</div>'; $("daysub").textContent = ""; return; }
      var saved = load(PW_KEY);
      if (saved) return start(saved, false).catch(function () {});
      $("gate").hidden = false;
      $("pw").focus();
    })
    .catch(function (e) {
      $("daysub").textContent = "";
      $("sheet").innerHTML = '<div class="msg">목록을 불러오지 못했습니다.<br>' + esc(e.message) + "</div>";
    });
})();
</script>

</body>
</html>
